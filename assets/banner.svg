<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" />

  <circle cx="200" cy="120" r="160" fill="#6366f1" opacity="0.25" filter="url(#blurFilter)" />
  <circle cx="1000" cy="280" r="180" fill="#10b981" opacity="0.18" filter="url(#blurFilter)" />

  <!-- Grid pattern overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="550" y1="0" x2="550" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="850" y1="0" x2="850" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Central Badge & Logo -->
  <g transform="translate(100, 70)">
    <!-- Icon container -->
    <rect x="0" y="25" width="90" height="90" rx="22" fill="#1f2937" stroke="#374151" stroke-width="2" />
    <path d="M45 42 L65 72 L52 72 L52 92 L38 92 L38 72 L25 72 Z" fill="url(#primaryGlow)" />
    
    <!-- Title text -->
    <text x="115" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Antigravity Custom Model Enabler
    </text>
    
    <text x="115" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" fill="#9ca3af">
      9Router &amp; Open-Source AI Gateway Edition
    </text>
  </g>

  <!-- Tags / Features pill container -->
  <g transform="translate(100, 230)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="10" fill="#1e1e2e" stroke="#3b4261" stroke-width="1.5" />
      <circle cx="22" cy="21" r="5" fill="#10b981" />
      <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">9Router Preset</text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(200, 0)">
      <rect width="210" height="42" rx="10" fill="#1e1e2e" stroke="#3b4261" stroke-width="1.5" />
      <circle cx="22" cy="21" r="5" fill="#6366f1" />
      <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">RTL &amp; Vazirmatn</text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(430, 0)">
      <rect width="190" height="42" rx="10" fill="#1e1e2e" stroke="#3b4261" stroke-width="1.5" />
      <circle cx="22" cy="21" r="5" fill="#38bdf8" />
      <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Claude / GPT-4o / Ollama</text>
    </g>

    <!-- Tag 4 -->
    <g transform="translate(640, 0)">
      <rect width="170" height="42" rx="10" fill="#1e1e2e" stroke="#3b4261" stroke-width="1.5" />
      <circle cx="22" cy="21" r="5" fill="#f59e0b" />
      <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Auto-Sync CI</text>
    </g>

    <!-- Tag 5 (Persian text) -->
    <g transform="translate(830, 0)">
      <rect width="170" height="42" rx="10" fill="#1e1e2e" stroke="#10b981" stroke-width="1.5" />
      <text x="85" y="26" text-anchor="middle" font-family="'Vazirmatn', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#34d399">پشتیبانی کامل فارسی</text>
    </g>
  </g>

  <!-- Bottom status bar -->
  <g transform="translate(100, 310)">
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#6b7280">
      Bypass Cloud Code restrictions · Zero vendor lock-in · 1-Click deploy
    </text>
  </g>
</svg>
